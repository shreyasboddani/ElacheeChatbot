name: Reconcile approved Gemini knowledge

on:
  # Started by hand or dispatched by the refresh workflow. It is deliberately
  # NOT a reusable (workflow_call) workflow: environment secrets did not reach
  # the called job, so GEMINI_API_KEY arrived empty and every sync failed.
  workflow_dispatch:
    inputs:
      revision:
        description: Exact verified main commit SHA to reconcile (defaults to the dispatched ref)
        required: false
        default: ""
        type: string

permissions:
  # write is used only to commit refreshed suggested-question answers to main.
  contents: write

concurrency:
  group: knowledge-production-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: knowledge-production
    steps:
      - name: Validate requested revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ -n "$REVISION" && ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full 40-character commit SHA."
            exit 1
          fi

      - name: Check out approved knowledge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Confirm protected Gemini configuration
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE: ${{ vars.GEMINI_FILE_SEARCH_STORE }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is not configured in the knowledge-production environment."; exit 1; }
          test -n "$GEMINI_FILE_SEARCH_STORE" || { echo "GEMINI_FILE_SEARCH_STORE is not configured in the knowledge-production environment."; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Verify approved corpus
        run: npm run knowledge:verify

      - name: Run automated tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Reconcile Gemini File Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE: ${{ vars.GEMINI_FILE_SEARCH_STORE }}
        run: npm run knowledge:sync -- --reconcile --apply

      # Suggested-question answers are generated once per knowledge version and
      # served without Gemini calls. This is a no-op (no API calls) when the
      # stored answers already match the current knowledge manifest.
      - name: Precompute suggested-question answers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE: ${{ vars.GEMINI_FILE_SEARCH_STORE }}
        # Model defaults to gemini-3.5-flash-lite (DEFAULT_GEMINI_MODEL).
        run: npm run knowledge:precompute

      - name: Commit refreshed suggested-question answers
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/generated/featured-answers.json; then
            echo "Suggested-question answers are already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced; the next sync regenerates answers for the newer knowledge (live answers are used meanwhile)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "elachee-knowledge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/featured-answers.json
          git commit -m "Refresh precomputed suggested-question answers"
          git push origin HEAD:main
          echo "Committed refreshed suggested-question answers to main." >> "$GITHUB_STEP_SUMMARY"
