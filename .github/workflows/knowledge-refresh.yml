name: Detect and commit website knowledge updates

on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - elachee-website-updated

permissions:
  actions: write
  contents: write

concurrency:
  group: knowledge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Avoid duplicate scheduled refreshes
        id: daily_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_day="$(date -u +'%Y-%m-%d')"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/knowledge-refresh.yml/runs?event=schedule&per_page=100"
          if ! response="$(curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_url")"; then
            echo "Could not inspect recent scheduled runs; proceeding with the refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! recent_success="$(jq -r \
            --arg current_day "$current_day" \
            --arg current_id "$GITHUB_RUN_ID" \
            '[.workflow_runs[]
              | select((.id | tostring) != $current_id)
              | select(.event == "schedule" and .status == "completed" and .conclusion == "success")
              | select(((.run_started_at // .created_at) | startswith($current_day)))]
            | length' <<< "$response")"; then
            echo "Could not parse recent scheduled runs; proceeding with the refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( recent_success > 0 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A scheduled knowledge refresh already succeeded today (UTC); skipping this backup trigger." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        if: steps.daily_guard.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.daily_guard.outputs.run == 'true'
        run: npm ci

      - name: Crawl, prepare, and verify public website content
        if: steps.daily_guard.outputs.run == 'true'
        run: npm run knowledge:refresh

      - name: Detect meaningful corpus changes
        id: changes
        if: steps.daily_guard.outputs.run == 'true'
        shell: bash
        run: |
          review_paths=(
            knowledge/generated/crawl-health.json
            knowledge/generated/sources.json
            knowledge/generated/prepared
            src/generated/knowledge-manifest.json
          )

          knowledge_changes="$(git status --porcelain --untracked-files=all -- "${review_paths[@]}")"
          if [[ -z "$knowledge_changes" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No verified public knowledge changes were detected; main and Gemini were left untouched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard the generated-file boundary
        if: steps.daily_guard.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          unexpected="$(git status --porcelain | cut -c4- | grep -Ev '^(knowledge/generated/|src/generated/knowledge-manifest\.json$)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "The public refresh modified files outside its generated-file boundary:"
            echo "$unexpected"
            exit 1
          fi

          staff_faq_changes="$(git status --porcelain --untracked-files=all -- \
            knowledge/generated/manager-faq.json \
            knowledge/generated/manager-faq-approved.md \
            knowledge/generated/manager-faq-pending.md \
            knowledge/generated/manager-faq-report.json \
            ':(glob)knowledge/generated/prepared/manager_faq__*.md')"
          if [[ -n "$staff_faq_changes" ]]; then
            echo "The public website refresh changed staff-managed FAQ files. Refusing to continue."
            echo "$staff_faq_changes"
            exit 1
          fi

      - name: Enforce a bounded safe automatic change set
        if: steps.daily_guard.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          changed_documents="$(git status --porcelain --untracked-files=all -- knowledge/generated/prepared | grep -c . || true)"
          deleted_paths="$(git diff --name-only --diff-filter=D HEAD -- knowledge/generated/prepared)"
          deleted_documents="$(printf '%s\n' "$deleted_paths" | grep -c . || true)"
          unexpected_deletions="$(printf '%s\n' "$deleted_paths" | grep -Ev '^$|^knowledge/generated/prepared/website__[^/]+\.md$' || true)"
          echo "Prepared documents changed: $changed_documents; deleted website documents: $deleted_documents" >> "$GITHUB_STEP_SUMMARY"

          if (( changed_documents > 20 )); then
            echo "The refresh changed $changed_documents prepared documents, exceeding the automatic safety limit of 20. Manual review is required."
            exit 1
          fi

          if [[ -n "$unexpected_deletions" ]]; then
            echo "Only website Markdown files may be removed automatically:"
            echo "$unexpected_deletions"
            exit 1
          fi

          if (( deleted_documents > 5 )); then
            echo "The refresh would remove $deleted_documents documents, exceeding the automatic removal limit of 5. Manual review is required."
            exit 1
          fi

      - name: Run the complete safety gate
        if: steps.daily_guard.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Commit verified knowledge directly to main
        if: steps.daily_guard.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced during validation. Refusing to overwrite it; the next run will recrawl from the new revision."
            exit 1
          fi

          git config user.name "elachee-knowledge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A knowledge/generated src/generated/knowledge-manifest.json
          git diff --cached --check
          git commit -m "Refresh Elachee website knowledge"
          revision="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Committed verified public knowledge to main at $revision. The protected Gemini reconciliation job will index it." >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      # The protected sync runs as its own workflow_dispatch run so its
      # `knowledge-production` environment secrets are available. Calling it
      # with `uses:` left that environment's secret empty. This job holds no
      # credentials; it only dispatches the exact verified revision and waits
      # for the result.
      - name: Dispatch and await protected Gemini reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.refresh.outputs.revision }}
        run: |
          set -euo pipefail

          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No verified revision was produced; refusing to dispatch the sync."
            exit 1
          fi

          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          dispatch_output="$(gh workflow run knowledge-sync.yml --repo "$GITHUB_REPOSITORY" --ref main -f revision="$REVISION" 2>&1)"
          echo "$dispatch_output"

          run_id="$(grep -oE 'actions/runs/[0-9]+' <<< "$dispatch_output" | head -n1 | cut -d/ -f3 || true)"
          for _ in $(seq 1 30); do
            [[ -n "$run_id" ]] && break
            sleep 5
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow knowledge-sync.yml \
              --event workflow_dispatch --branch main --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | .[0].databaseId // empty")"
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not find the dispatched Gemini reconciliation run."
            exit 1
          fi

          echo "Waiting for protected Gemini reconciliation run $run_id." >> "$GITHUB_STEP_SUMMARY"

          # Poll the run state ourselves: the CLI's built-in watcher failed the
          # whole job on a transient 404 from the jobs endpoint even though the dispatched
          # sync went on to succeed. Tolerate short API hiccups, but still fail
          # if the sync run itself fails or never finishes.
          api_errors=0
          for _ in $(seq 1 280); do
            if state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '[.status, (.conclusion // "")] | @tsv')"; then
              api_errors=0
              status="${state%%$'\t'*}"
              conclusion="${state#*$'\t'}"
              if [[ "$status" == "completed" ]]; then
                echo "Protected Gemini reconciliation run $run_id finished: ${conclusion:-unknown}."
                echo "Protected Gemini reconciliation run $run_id finished: ${conclusion:-unknown}." >> "$GITHUB_STEP_SUMMARY"
                [[ "$conclusion" == "success" ]] && exit 0
                exit 1
              fi
            else
              api_errors=$((api_errors + 1))
              echo "Could not read run $run_id (attempt $api_errors); retrying."
              if (( api_errors >= 20 )); then
                echo "Giving up after repeated errors reading run $run_id."
                exit 1
              fi
            fi
            sleep 15
          done
          echo "Timed out waiting for protected Gemini reconciliation run $run_id."
          exit 1
